services:
  # PostgreSQL Database
  postgres:
    image: postgres:17
    container_name: api_dotnet_10_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-api_dotnet_10}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - api_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  # .NET 10 API
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: api_dotnet_10_app
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=api_dotnet_10;Username=postgres;Password=123
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - api_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  api_network:
    driver: bridge
